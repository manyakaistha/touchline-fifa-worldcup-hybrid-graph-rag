[project]
name = "fifa-hybrid-graphrag"
version = "0.1.0"
description = "Local-first FIFA knowledge graph and hybrid evidence workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "kuzu==0.11.3", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "scikit-learn>=1.6,<2", "numpy>=2,<3", "scipy>=1.15,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/fifa_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
